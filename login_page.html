<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="page">
        <div class="head"><h1>Login</h1></div>
        <form action="">
            <div class="box"><input type="text" placeholder="Username" required><i class='bx bx-user'></i></div>
            <div class="box"><input type="password" placeholder="Password" required><i class='bx bxs-lock-alt'></i></div>
            <div class="forgot">
                <div class="rem"><label for="password"><input type="checkbox">Remember me</label></div>
                <div class="for"><a href="#">Forgot Password?</a></div>
            </div>
            <div class="btn"><button type="submit">Login</button></div>
            <div class="reg"><p>Don't have an account?</p><a href="#">Register</a></div>
        </form>
    </div>
</body>
</html>
